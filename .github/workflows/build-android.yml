name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # APK 内嵌的后端地址。
  # 打包成原生 App 后页面走 file:// 协议，相对路径 /api 会解析失败，
  # 所以必须在这里注入完整地址。换服务器时改这一行即可。
  VITE_API_BASE: 'http://106.14.70.32/api'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # 不用 android-actions/setup-android：它会去下载一份新的 cmdline-tools，
          # 然后用无人应答的交互式 `sdkmanager --licenses` 接受协议，stdin 为空就 exit 1。
          # 这里直接用 runner 预装的 SDK，并用 yes 把协议一次性灌进去。
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          # 预装的 sdkmanager 可能在 cmdline-tools/latest 或某个版本号目录下，全找一遍
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "##[error]未找到 sdkmanager，SDK_ROOT=$SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"

          # yes 全程回答 y，避免 license 交互阻塞
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # 装构建所需组件（含 build-tools，Capacitor 编译需要）
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || \
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

          echo "--- 已安装组件 ---"
          ls "$SDK_ROOT/platforms" 2>/dev/null || true
          ls "$SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Pin Android SDK versions
        run: |
          # Capcitor 生成的工程默认 compileSdk 可能高于上面装的版本，
          # 固定成已安装的版本，避免 gradle 触发自动下载 SDK 而失败。
          VARS="android/variables.gradle"
          if [ -f "$VARS" ]; then
            sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 34/" "$VARS"
            sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 34/" "$VARS"
            sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 23/" "$VARS"
            echo "--- variables.gradle ---"
            cat "$VARS"
          fi

          # 允许 gradle 自动接受 SDK 许可，并指向预装 SDK
          mkdir -p android
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
          } > android/local.properties
          cat android/local.properties

      - name: Allow cleartext HTTP & device permissions
        run: |
          # 后端目前是 http（无域名无证书），Android 9+ 默认禁止明文流量，
          # 这里给 WebView 放行，否则 App 内所有 API 请求都会被系统拦截。
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -o 'android:usesCleartextTraffic="true"' "$MANIFEST" || echo "警告：明文流量未放行"

          # ── 需要声明的权限 ──
          # RECORD_AUDIO / MODIFY_AUDIO_SETTINGS：语音识别与朗读
          # READ_EXTERNAL_STORAGE (maxSdkVersion=32)：仅给 Android 12 及以下老设备兜底。
          #   上传试卷走的是 SAF 系统文件选择器，本身就按文件授权、不需要运行时权限，
          #   但部分老机型在读取 content:// URI 时仍会查这条声明。
          # READ_MEDIA_IMAGES：Android 13+ 读图片媒体的对应权限。
          #
          # 刻意【不声明】CAMERA：
          #   我们只通过 <input capture> 让系统相机应用代拍，照片经 URI 回传，
          #   本应用并不直接调用相机 API，因此不需要 CAMERA。
          #   反而如果声明了却没在运行时授予，系统会拒绝 ACTION_IMAGE_CAPTURE，
          #   把拍照功能弄坏。
          PERMS='<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'

          if ! grep -q 'RECORD_AUDIO' "$MANIFEST"; then
            sed -i "s|<uses-permission android:name=\"android.permission.INTERNET\" />|<uses-permission android:name=\"android.permission.INTERNET\" />\n    $PERMS|" "$MANIFEST"
          else
            # 已有录音权限时，只补存储相关那两条（可能来自更早的构建）
            if ! grep -q 'READ_EXTERNAL_STORAGE' "$MANIFEST"; then
              sed -i "s|<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />|<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />|" "$MANIFEST"
            fi
          fi

          echo "--- 权限清单 ---"
          grep -o '<uses-permission[^/]*/>' "$MANIFEST" || true

          for p in INTERNET RECORD_AUDIO READ_EXTERNAL_STORAGE READ_MEDIA_IMAGES; do
            if grep -q "$p" "$MANIFEST"; then echo "  $p ✓"; else echo "  $p ✗ 缺失"; fi
          done
          if grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "  警告：声明了 CAMERA，会让 <input capture> 拍照路径失效，建议移除"
          else
            echo "  CAMERA 未声明 ✓（符合预期）"
          fi

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/maneji-debug.apk
          echo "APK 大小: $(du -h out/maneji-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maneji-apk
          path: out/maneji-debug.apk
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/maneji-debug.apk
